services:
  server1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: server1
    hostname: server1
    ports:
      - "2201:22"
    networks:
      ansible_net:
        ipv4_address: 172.28.0.11
    restart: unless-stopped

